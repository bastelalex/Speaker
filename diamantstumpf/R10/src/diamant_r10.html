<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLANAL · restless.audio · Diamantstumpf R10</title>
<style>
:root{color-scheme:light;font-family:"Instrument Sans",system-ui,sans-serif;color:#233237;background:#f1eee8;--line:#d6d4cc;--muted:#536469;--teal:#294c55;--paper:#fbfaf6}
*{box-sizing:border-box}body{margin:0}main{max-width:1510px;margin:auto;padding:26px clamp(12px,3vw,40px) 29px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:720}
h1{margin:4px 0 0;font-size:clamp(34px,5vw,63px);line-height:1;font-weight:650;letter-spacing:-.055em}
h2{margin:0 0 9px;font-size:19px;line-height:1.2}p{margin:0;line-height:1.48}
button,select{font:inherit;border:1px solid var(--line);background:white;color:inherit;border-radius:6px;padding:7px 10px}
button{cursor:pointer}button:hover,select:hover{border-color:var(--teal)}button[aria-pressed=true]{color:white;background:var(--teal);border-color:var(--teal)}
:focus-visible{outline:2px solid #3b747e;outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:13px;align-items:start}
figure,aside{margin:0;border:1px solid var(--line);border-radius:11px;background:var(--paper);overflow:hidden}
#stage{height:clamp(540px,57vw,745px);position:relative;background:#e0e3df;overflow:hidden}
#stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#stage canvas:active{cursor:grabbing}
#reset{position:absolute;z-index:3;right:13px;top:13px}
.tag{position:absolute;z-index:2;pointer-events:none;background:#fdfbf2ec;padding:5px 7px;border-radius:5px;border:1px solid #ddd9cd;font-size:12px;color:#273b41;white-space:nowrap}
#stage-title{top:13px;left:13px}.sample-tag{transform:translateX(-50%)}
figcaption{border-top:1px solid var(--line);padding:10px 13px;font-size:13px;color:var(--muted)}
aside section{padding:14px 15px;border-bottom:1px solid var(--line)}aside section:last-child{border:0}
select{width:100%}.small{font-size:13px;color:var(--muted);margin-top:7px}.dimension{font-variant-numeric:tabular-nums}
#projection{font-size:27px;line-height:1.15;font-weight:650;letter-spacing:-.035em}
#prism-actions,#signature-actions{margin-top:9px}[hidden]{display:none!important}
#solanal{background:#f4ead9} #solanal label:not(.upload){display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.range{display:flex;gap:10px;align-items:center}.range input{min-width:0;flex:1;accent-color:#875d3c}
.range output{font-size:13px;min-width:44px;text-align:right}
.upload{display:block;font-size:12px;margin:11px 0 3px}
input[type=file]{display:block;max-width:100%;font:inherit;font-size:12px;margin-top:5px}
.downloads{margin-top:8px}.downloads button{font-size:12px}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}#stage{height:clamp(425px,85vw,680px)}aside{display:grid;grid-template-columns:1fr 1fr}aside section{border:0}}
@media(max-width:500px){main{padding-top:15px}aside{display:block}aside section{border-bottom:1px solid var(--line)}button{font-size:13px;padding:7px 8px}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">restless.audio · Diamantstumpf R10</div><h1>SOLANAL</h1></div>
    <nav class="tabs" aria-label="Ansicht">
      <button data-view="center" aria-pressed="true">Mittelmodul</button>
      <button data-view="all" aria-pressed="false">Gesamtaufbau</button>
      <button data-view="detail" aria-pressed="false">Kassette</button>
      <button data-view="compare" aria-pressed="false">Signature-Vergleich</button>
    </nav>
  </header>
  <div class="layout">
    <figure>
      <div id="stage" aria-label="Drehbares 3D-Modell des Mittelmoduls">
        <span class="tag" id="stage-title"></span>
        <button id="reset" aria-label="Kamera zurücksetzen">↺</button>
      </div>
      <figcaption id="caption" aria-live="polite"></figcaption>
    </figure>
    <aside>
      <section>
        <h2>Zentralkassette</h2>
        <select id="horn" aria-label="Zentralkassette"></select>
        <div class="tabs" id="prism-actions" hidden>
          <button id="explode" aria-pressed="false">Aufsatz abheben</button>
        </div>
        <div class="tabs" id="signature-actions" hidden>
          <button id="reflectors" aria-pressed="true">Leitprismen</button>
          <button id="entries" aria-pressed="false">Seiteneintritte</button>
        </div>
      </section>
      <section id="solanal" hidden>
        <h2>Deine Kontur</h2>
        <label for="profile">Profil</label><select id="profile"></select>
        <label for="relief">Reliefstärke</label>
        <div class="range"><input id="relief" type="range" min="0" max="100" step="1" value="76"><output id="relief-value" for="relief">76 %</output></div>
        <label class="upload" for="profile-file">Konturdatei laden · JSON mit 32 Radien</label>
        <input id="profile-file" type="file" accept=".json,application/json">
        <p class="small">32 Radien vom Konturmittelpunkt, beginnend rechts, gegen den Uhrzeigersinn. Die Verarbeitung bleibt lokal.</p>
        <p class="small" id="profile-message" role="status"></p>
        <div class="tabs downloads">
          <button id="example">JSON-Vorlage</button><button id="export">Horn als STL</button>
        </div>
      </section>
      <section id="details">
        <h2 id="name"></h2>
        <p id="projection" class="dimension"></p>
        <p id="description" class="small"></p>
      </section>
      <section>
        <h2>Schnittstelle</h2>
        <p id="interface" class="small"></p>
        <p class="small">Geometriestudie. Abstrahlung und Übergänge zwischen den Wegen bleiben zu messen.</p>
      </section>
    </aside>
  </div>
</main>
<script>/*THREE*/</script>
<script id="model-data" type="application/octet-stream">/*DATA*/</script>
<script type="module">
const bytes=Uint8Array.from(atob(document.querySelector('#model-data').textContent),c=>c.charCodeAt(0));
const data=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const $=s=>document.querySelector(s);
const stage=$('#stage'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,1,3,15000);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#e0e3df');
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.13;
stage.append(renderer.domElement);

/*STUDIO*/
scene.environment=studioEnvironment(renderer);
scene.add(new THREE.HemisphereLight(0xf8fbff,0xa39b89,.86));
function lamp(color,power,x,y,z){
  const light=new THREE.DirectionalLight(color,power);
  light.position.set(x,y,z);scene.add(light);
}
lamp(0xfff4e5,2,-900,1400,1200);
lamp(0xe4efff,1.28,850,1150,-850);
lamp(0xf5f6f8,.65,740,410,900);
function satin(color,roughness=.31,metalness=.64){
  return new THREE.MeshStandardMaterial({color,roughness,metalness,envMapIntensity:1.15});
}
const silver=satin('#bcc5cb');
const prismSilver=satin('#c2c9ce',.26,.78);
const frameMat=satin('#87949b',.39);
const screwMat=satin('#53656f',.36);
const motorMat=satin('#2f393f',.78,.12);
const portMat=satin('#d79037',.32,.44);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(15000,15000),
  new THREE.MeshBasicMaterial({color:'#e0e3df',toneMapped:false}));
floor.rotation.x=-Math.PI/2;floor.position.y=-4;scene.add(floor);
const paper=document.createElement('canvas');paper.width=128;paper.height=128;
const context=paper.getContext('2d'),gradient=context.createRadialGradient(64,64,8,64,64,62);
gradient.addColorStop(0,'rgba(21,25,25,.64)');gradient.addColorStop(1,'rgba(21,25,25,0)');
context.fillStyle=gradient;context.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1800,1310),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(paper),transparent:true,depthWrite:false,toneMapped:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-2,-350);scene.add(shadow);

const unpack=(s,Type)=>new Type(Uint8Array.from(atob(s),v=>v.charCodeAt(0)).buffer);
function indexedGeometry(part){
  const indexed=new THREE.BufferGeometry();
  indexed.setAttribute('position',new THREE.BufferAttribute(unpack(part.v,Float32Array),3));
  indexed.setIndex(new THREE.BufferAttribute(unpack(part.t,Uint32Array),1));
  return indexed;
}
function geometry(part,smooth=false){
  const indexed=indexedGeometry(part);
  const flat=indexed.toNonIndexed();flat.computeVertexNormals();
  if(smooth)creaseNormals(indexed,flat);
  indexed.dispose();
  return flat;
}
const fixed=data.parts.filter(p=>p.module!=='demo'&&['shell','wood-front','front','wheel'].includes(p.kind)).map(p=>{
  const g=geometry(p,p.name.endsWith('Frontkanäle'));
  const material=surfaceMaterial(p,g);
  const mesh=new THREE.Mesh(g,material);scene.add(mesh);
  return {mesh,module:p.module,replaced:p.module==='center'&&p.kind==='front'};
});
const wideFront=data.wideFront.map((part,i)=>{
  const g=geometry(part,Boolean(i));
  const material=surfaceMaterial({kind:'front',module:'center',color:i?'#acb6bd':'#b8bec3'},g);
  const mesh=new THREE.Mesh(g,material);scene.add(mesh);
  return mesh;
});
const hornGeometries={};
function hornMesh(key){
  return hornGeometries[key]??=geometry(data.hornMeshes[key],true);
}
const motorGeometry=geometry(data.motorMesh,true);
const plateGeometry=geometry(data.prismPlate);
const screwGeometry=geometry(data.prismFasteners,true);
const blades=Object.fromEntries(Object.entries(data.prisms).map(([key,p])=>[key,geometry(p.blades)]));
const signatures={};
/*SOLANAL*/
function signature(key){
  if(signatures[key])return signatures[key];
  const spec=data.signature[key],group=new THREE.Group();
  if(key==='SL'){
    const topology=indexedGeometry(spec.mesh);
    const flat=topology.toNonIndexed();
    const mesh=new THREE.Mesh(flat,layerMat);
    mesh.userData.base=flat.attributes.position.array.slice();
    mesh.userData.topology=topology;
    group.add(mesh);
  }else{
    group.add(new THREE.Mesh(geometry(spec.mesh,true),silver));
  }
  const motor=new THREE.Mesh(motorGeometry,motorMat);
  motor.position.z=-spec.d-9;group.add(motor);
  const reflectors=spec.reflectors?new THREE.Mesh(geometry(spec.reflectors),prismSilver):null;
  if(reflectors)group.add(reflectors);
  const ports=new THREE.Group();
  if(spec.entries){
    ports.add(new THREE.Mesh(geometry(spec.entries,true),portMat));
    ports.add(new THREE.Mesh(geometry(spec.drivers,true),motorMat));
  }
  group.add(ports);
  return signatures[key]={group,reflectors,ports,apart(){}};
}

function buildCassette(key){
  const prism=Boolean(data.prisms[key]),backKey=prism?data.prismBacking:key;
  const group=new THREE.Group();
  const back=new THREE.Mesh(hornMesh(backKey),silver);
  const motor=new THREE.Mesh(motorGeometry,motorMat);
  motor.position.z=-data.geometry.horns[backKey].d-9;
  back.add(motor);group.add(back);
  let face,screws;
  if(prism){
    face=new THREE.Mesh(plateGeometry,frameMat);
    face.add(new THREE.Mesh(blades[key],prismSilver));
    screws=new THREE.Mesh(screwGeometry,screwMat);
    group.add(face,screws);
  }
  function apart(state){
    if(!face)return;
    face.position.z=state?108:0;
    screws.position.z=state?151:0;
  }
  return {group,apart};
}
const tops=[];
const a=Math.atan2(100,800), l=Math.hypot(100,800), end=(l-800)/2;
const sideX=300-end*100/l+200*Math.cos(a),sideZ=-end*800/l-200*Math.sin(a);
for(const sign of [-1,1]){
  const {group}=buildCassette(data.geometry.topHorn);
  group.position.set(sign*sideX,600,sideZ);group.rotation.y=sign*a;group.scale.x=sign;
  tops.push(group);scene.add(group);
}
const comparison=['S1','S2','S3'].map((key,index)=>{
  const group=signature(key).group.clone();
  group.children.at(-1).visible=false;
  group.position.set((index-1)*617,600,0);group.rotation.y=.19;
  const tag=document.createElement('span');
  tag.className='tag sample-tag';tag.textContent=key+' · '+data.signature[key].name;
  stage.append(tag);scene.add(group);
  return {group,tag};
});
const cache={};
function cassette(key){
  if(!cache[key]){
    cache[key]=data.signature[key]?signature(key):buildCassette(key);
    cache[key].group.position.y=600;scene.add(cache[key].group);
  }
  return cache[key];
}
const select=$('#horn');
function appendOptions(label,items){
  const group=document.createElement('optgroup');group.label=label;
  for(const [key,value] of items)group.append(new Option(key==='SL'?value.name:key+' · '+value.name,key));
  select.append(group);
}
appendOptions('Boxenbreite Signature-Hörner',Object.entries(data.signature));
appendOptions('Prismenaufsätze',Object.entries(data.prisms));
appendOptions('Bisherige Hörner',Object.entries(data.geometry.horns));

let view='detail',selected='SL',exploded=false,showReflectors=true,showEntries=false,theta=.46,phi=.16,dist=2200;
const target=new THREE.Vector3(0,575,-240);
function draw(){
  const aspectFloor=view==='compare'?1.55:view==='all'?1.32:view==='detail'?1.05:.86;
  const d=dist*Math.max(1,aspectFloor/camera.aspect);
  camera.position.set(target.x+d*Math.cos(phi)*Math.sin(theta),target.y+d*Math.sin(phi),
    target.z+d*Math.cos(phi)*Math.cos(theta));
  camera.lookAt(target);renderer.render(scene,camera);
  for(const {group,tag} of comparison){
    if(tag.hidden)continue;
    const p=group.position.clone().add(new THREE.Vector3(0,-164,5)).project(camera);
    tag.style.left=(p.x*.5+.5)*stage.clientWidth+'px';
    tag.style.top=(.5-p.y*.5)*stage.clientHeight+'px';
  }
}
function sync(){
  const moduleView=view==='all'||view==='center',gallery=view==='compare';
  const wide=data.signature[selected],prism=data.prisms[selected];
  const info=wide??prism??data.geometry.horns[selected];
  floor.visible=shadow.visible=moduleView;
  shadow.scale.x=view==='all'?1:.62;
  for(const p of fixed)p.mesh.visible=(view==='all'||view==='center'&&p.module==='center')&&!(wide&&p.replaced);
  for(const mesh of wideFront)mesh.visible=Boolean(wide)&&moduleView;
  for(const top of tops)top.visible=view==='all';
  const current=cassette(selected);
  for(const {group} of Object.values(cache))group.visible=group===current.group&&!gallery;
  current.apart(view==='detail'&&exploded);
  if(current.reflectors)current.reflectors.visible=showReflectors;
  if(current.ports)current.ports.visible=view==='detail'&&showEntries;
  for(const item of comparison){
    item.group.visible=gallery;
    item.tag.hidden=!gallery;
  }
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
  $('#prism-actions').hidden=view!=='detail'||!prism;
  $('#signature-actions').hidden=!wide||gallery||selected==='S2';
  solanal.hidden=selected!=='SL'||gallery;
  $('#reflectors').hidden=selected!=='S1';
  $('#reflectors').setAttribute('aria-pressed',String(showReflectors));
  $('#entries').hidden=!wide?.entries;
  $('#entries').setAttribute('aria-pressed',String(showEntries));
  $('#explode').setAttribute('aria-pressed',String(exploded));
  $('#explode').textContent=exploded?'Aufsatz einsetzen':'Aufsatz abheben';
  select.value=selected;
  const name=selected==='SL'?info.name:selected+' · '+info.name;
  $('#name').textContent=name;
  const mm=prism?.projection??info.overhang;
  $('#projection').textContent=wide?wide.w+' × '+wide.h+' mm':mm?String(mm).replace('.',',')+' mm Vorsprung':'Bündiger Mund';
  $('#description').textContent=info.description+(prism?' Die getrennten Leitkörper greifen die Formstudie der M23-Vollzelle auf.':'');
  $('#interface').textContent=wide?'Rechteckplatte '+data.signaturePlate.join(' × ')+' mm · Gehäusebreite 600 mm · '+wide.d+' mm Horntiefe':
    '270 × 270 mm · Bohrbild 254 × 254 mm';
  $('#stage-title').textContent=gallery?'Signature-Hörner S1–S3':name;
  $('#caption').textContent=({
    center:wide?'Signature-Horn im mittleren Rechteck. Beide Polycell-Raster und alle sechs Bassmünder bleiben.':
      data.geometry.fixedCellCount+' Zellen und der kleine Kassettensitz.',
    all:'Die Zentralkassette sitzt im Mittelmodul. Beide Tops zeigen Manta Tief.',
    detail:wide?(showEntries?'Vier Seiteneintritte. Farbige Volumen markieren Anschlusswege und schematische Treiberplätze.':
      selected==='SL'?'Multiplex-Ansicht mit individualisierbarem Relief. Ziehen zum Drehen.':'Signature-Horn mit gemeinsamer rechteckiger Schnittstelle.'):
      prism?'Prismenaufsatz, Konturhorn A und vier Befestigungspunkte.':'Bestandshorn für den kleinen Kassettensitz.',
    compare:'Schwingenmund, Vierfächer und Solana-inspirierter Vierfach-Eintritt in derselben Frontaufnahme.'
  })[view];
  window.r10State={view,selected,exploded,topHorn:data.geometry.topHorn,
    cells:data.geometry.fixedCellCount-(wide?data.replacedCells.length:0),
    removed:data.replacedCells,horns:Object.keys(data.geometry.horns),prisms:Object.keys(data.prisms),
    signatures:Object.keys(data.signature),showReflectors,showEntries,solanalMode,relief};
  draw();
}
function reset(){
  const cameras={
    center:[.54,.17,2270,-8,558,-260],all:[.68,.22,2630,30,554,-315],
    detail:data.signature[selected]?(showEntries?[1.1,.24,1070,0,600,-136]:
      selected==='SL'?[.09,.12,940,0,596,-44]:[.49,.16,1050,0,587,-72]):
      exploded?[.91,.19,805,10,600,-13]:[.50,.16,705,0,600,-47],
    compare:[.04,.15,1940,0,580,-62]
  };
  const [a,b,c,x,y,z]=cameras[view];
  theta=a;phi=b;dist=c;target.set(x,y,z);sync();
}
function resize(){
  renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;
  camera.updateProjectionMatrix();draw();
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;reset();}));
select.addEventListener('change',()=>{selected=select.value;exploded=false;showEntries=false;if(view==='compare')view='detail';reset();});
$('#reset').addEventListener('click',reset);
$('#explode').addEventListener('click',()=>{exploded=!exploded;reset();});
$('#reflectors').addEventListener('click',()=>{showReflectors=!showReflectors;sync();});
$('#entries').addEventListener('click',()=>{view='detail';showEntries=!showEntries;reset();});
const canvas=renderer.domElement;
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  theta-=(e.clientX-drag[0])*.007;phi=Math.max(-1.4,Math.min(1.52,phi+(e.clientY-drag[1])*.007));
  drag=[e.clientX,e.clientY];draw();
});
for(const evt of ['pointerup','pointercancel'])canvas.addEventListener(evt,()=>{drag=null;});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();dist=Math.min(6200,Math.max(view==='detail'?220:650,dist*Math.exp(e.deltaY*.001)));draw();
},{passive:false});
new ResizeObserver(resize).observe(stage);
profileSelect.value=solanalMode;
morphSolanal();resize();reset();window.modelReady=true;
</script>
</body>
</html>
